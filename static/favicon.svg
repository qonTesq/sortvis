<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Minimalist Background: True Black -->
  <rect width="512" height="512" rx="128" fill="#000000"/>

  <!-- Concept: "The Pixel Cascade" - Restored -->
  
  <!-- Top Right (Order): Solid White Square -->
  <rect x="272" y="96" width="144" height="144" rx="24" fill="white"/>

  <!-- Center (Process): 70% Opacity Square -->
  <rect x="184" y="184" width="144" height="144" rx="24" fill="white" fill-opacity="0.7"/>

  <!-- Bottom Left (Chaos): 40% Opacity Square, Falling away -->
  <rect x="96" y="272" width="144" height="144" rx="24" fill="white" fill-opacity="0.4"/>

  <!-- The "Pivot" or "Active" Dot - Leading the sort -->
  <!-- Negative space dot in the center of the overlap -->
  <circle cx="256" cy="256" r="24" fill="#000000"/> 

</svg>